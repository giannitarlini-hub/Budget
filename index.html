<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>Store Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f6fa;color:#18202f}
.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:85px}header{background:#111827;color:#fff;padding:18px;border-radius:0 0 24px 24px}
.brand{font-size:12px;opacity:.65}.title{font-size:27px;font-weight:800}.role{float:right;margin-top:-30px;background:#ffffff18;border:1px solid #ffffff22;padding:7px 10px;border-radius:12px;font-size:12px}
main{padding:16px}.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px #18202f0b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f7f8fb;padding:14px;border-radius:16px}.metric b{display:block;font-size:23px}.muted{color:#737d8d;font-size:13px}.section{font-size:18px;font-weight:800;margin:20px 2px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{padding:6px 9px;border-radius:10px;font-size:12px;font-weight:700;background:#eef2ff;color:#4054c5}.green{background:#e9f8ef;color:#177245}.yellow{background:#fff5dc;color:#9a6a00}.red{background:#ffe9eb;color:#b42332}
.person,.task{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #eee}.person:last-child,.task:last-child{border:0}.avatar{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#e9edff;font-weight:800;color:#4054c5}.task{justify-content:space-between}.btn{padding:11px 13px;border-radius:13px;background:#111827;color:#fff;font-weight:700}.btn.light{background:#eef1f6;color:#202838}.btn.green{background:#159447}.btn.red{background:#d73a49}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;height:76px;background:#fff;border-top:1px solid #e7eaf0;display:flex;justify-content:space-around;padding-top:8px;z-index:5}
.nav button{background:none;color:#7a8494;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px}.nav button.active{color:#4054c5;font-weight:800}.icon{font-size:21px}
</style></head><body><div class="app"><header><div class="brand">STORE MANAGER</div><div class="title">Gestione Personale</div><div class="role" onclick="switchRole()" id="role">Store Manager</div></header><main id="content"></main><nav class="nav" id="nav"></nav></div>
<script>
const staff=["Alice","Federica","Gherlys","Camilla","Daniele"];
let s=JSON.parse(localStorage.getItem("sm_v1")||"null")||{mode:"manager",tab:"home",requests:[{id:1,p:"Federica",d:"12–13 ottobre",n:"Impegni personali",st:"pending"}],tasks:[["Apertura negozio","Alice"],["Controllo magazzino","Gherlys"],["Sistemazione denim","Federica"],["Controllo cassa","Camilla"],["Chiusura","Daniele"]]};
function save(){localStorage.setItem("sm_v1",JSON.stringify(s))}
function pending(){return s.requests.filter(x=>x.st=="pending").length}
function render(){
document.getElementById("role").textContent=s.mode=="manager"?"Store Manager":"Risorsa";
let c=s.tab=="home"?home():s.tab=="planning"?planning():s.tab=="tasks"?tasks():s.tab=="people"?people():requests();
document.getElementById("content").innerHTML=c;
let n=s.mode=="manager"?[["home","⌂","Home"],["planning","▦","Planning"],["tasks","✓","Attività"],["people","♙","Personale"],["requests","✉","Richieste"]]:[["home","⌂","Home"],["planning","▦","Miei turni"],["requests","✉","Richieste"]];
document.getElementById("nav").innerHTML=n.map(x=>`<button class="${s.tab==x[0]?"active":""}" onclick="s.tab='${x[0]}';save();render()"><span class="icon">${x[1]}</span>${x[2]}${x[0]=="requests"&&pending()?` (${pending()})`:""}</button>`).join("");
}
function home(){if(s.mode=="resource")return `<div class="card"><div class="muted">AREA RISORSA</div><h2>Ciao Federica 👋</h2><p class="muted">Qui trovi i tuoi turni, le tue attività e le tue richieste.</p></div><div class="section">Prossimo turno</div><div class="card"><b>Sabato 19 settembre</b><div class="muted">10:00–18:00 · Store</div></div>`;
return `<div class="card"><div class="muted">OGGI · 18 SETTEMBRE</div><h2>Buonasera 👋</h2><div class="grid"><div class="metric"><span class="muted">In turno</span><b>4</b></div><div class="metric"><span class="muted">Attività</span><b>${s.tasks.length}</b></div><div class="metric"><span class="muted">Richieste</span><b>${pending()}</b></div><div class="metric"><span class="muted">Copertura</span><b>100%</b></div></div></div><div class="section">Attività di oggi</div><div class="card">${s.tasks.map(t=>`<div class="task"><div><b>${t[0]}</b><div class="muted">${t[1]}</div></div><span class="pill green">Assegnata</span></div>`).join("")}</div>`}
function planning(){return `<div class="section">${s.mode=="manager"?"Planning settimana":"I miei turni"}</div><div class="card">${["Lun 14","Mar 15","Mer 16","Gio 17","Ven 18","Sab 19","Dom 20"].map((d,i)=>`<div class="task"><div><b>${d} settembre</b><div class="muted">${s.mode=="manager"?(i==6?"5 persone":"4 persone"):(i<2?"10:00–18:00":"Riposo")}</div></div><span class="pill ${i<2?"green":""}">${s.mode=="manager"?"Copertura":"Turno"}</span></div>`).join("")}</div>`}
function tasks(){return `<div class="row"><div class="section">Attività di oggi</div><button class="btn" onclick="addTask()">+ Attività</button></div><div class="card">${s.tasks.map(t=>`<div class="task"><div><b>${t[0]}</b><div class="muted">Assegnata a ${t[1]}</div></div><span class="pill">Oggi</span></div>`).join("")}</div><div class="card"><b>Assegnazione automatica</b><p class="muted">Distribuisce e ruota le attività tra le risorse presenti.</p><button class="btn" onclick="auto()">Genera attività</button></div>`}
function people(){return `<div class="section">Personale</div><div class="card">${staff.map(x=>`<div class="person"><div class="avatar">${x[0]}</div><div style="flex:1"><b>${x}</b><div class="muted">Risorsa · attiva</div></div><span class="pill green">Attiva</span></div>`).join("")}</div>`}
function requests(){if(s.mode=="resource")return `<div class="row"><div class="section">Le mie richieste</div><button class="btn" onclick="req()">+ Richiesta</button></div><div class="card">${s.requests.filter(x=>x.p=="Federica").map(x=>`<div class="task"><div><b>${x.d}</b><div class="muted">${x.n}</div></div><span class="pill ${x.st=="approved"?"green":x.st=="rejected"?"red":"yellow"}">${x.st=="pending"?"In attesa":x.st=="approved"?"Approvata":"Rifiutata"}</span></div>`).join("")}</div>`;
return `<div class="section">Richieste giorni liberi</div><div class="card">${s.requests.map(x=>`<div style="padding:12px 0;border-bottom:1px solid #eee"><div class="row"><div><b>${x.p}</b><div class="muted">${x.d}</div></div><span class="pill yellow">${x.st=="pending"?"In attesa":x.st}</span></div><p class="muted">${x.n}</p>${x.st=="pending"?`<button class="btn green" onclick="answer(${x.id},'approved')">Approva</button> <button class="btn red" onclick="answer(${x.id},'rejected')">Rifiuta</button>`:""}</div>`).join("")}</div>`}
function switchRole(){s.mode=s.mode=="manager"?"resource":"manager";s.tab="home";save();render()}
function answer(id,st){s.requests.find(x=>x.id==id).st=st;save();render()}
function req(){let d=prompt("Quali giorni vuoi richiedere?");if(!d)return;s.requests.unshift({id:Date.now(),p:"Federica",d,n:"Richiesta personale",st:"pending"});save();render()}
function addTask(){let t=prompt("Nome attività");if(t){s.tasks.push([t,staff[s.tasks.length%staff.length]]);save();render()}}
function auto(){s.tasks=s.tasks.map((x,i)=>[x[0],staff[i%staff.length]]);save();render()}
render();
</script></body></html>
